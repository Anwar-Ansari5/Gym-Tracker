{% extends 'base.html' %}
{% block title %}Login – Gym Tracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <!-- Left: gym image -->
  <div class="auth-image" style="background-image:url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=900&auto=format&fit=crop')">
    <div class="auth-image-overlay">
      <div class="auth-quote">
        <i class="ti ti-barbell" style="font-size:2rem;color:var(--accent)"></i>
        <h2 class="mt-3">Track every rep.<br>Own every PR.</h2>
        <p class="text-muted mt-2">Your gym progress, visualized.</p>
      </div>
    </div>
  </div>

  <!-- Right: form -->
  <div class="auth-form-side">
    <div class="auth-form-box">
      <h4 class="mb-1" style="color:var(--text)">Welcome back</h4>
      <p class="text-muted small mb-4">Sign in to your account</p>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus />
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="ti ti-login me-1"></i>Log in
        </button>
      </form>
      <hr style="border-color:var(--border);margin:1.25rem 0">
      <p class="text-center text-muted small mb-0">
        Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--accent)">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
